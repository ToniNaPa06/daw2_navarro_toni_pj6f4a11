<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creación de nuevo pedido - Joyería">
  <title>Nuevo Pedido - Gestión de Pedidos</title>
  <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
  <main class="container container-wide">
    <div class="glass-card order-card">
      <header>
        <div class="app-badge">Nuevo Pedido</div>
        <h1 class="app-title" style="font-size: 1.8rem; margin-bottom: 0.4rem;">Registrar Orden de Venta</h1>
        <p class="app-subtitle" style="margin-bottom: 1.5rem;">
          Selecciona el cliente y los productos requeridos para calcular el pedido.
        </p>
      </header>

      <div id="order-alert" class="alert alert-danger" role="alert" aria-live="polite"></div>

      <form id="order-form">
        <div class="order-grid">
          
          <!-- Columna Izquierda: Datos del cliente -->
          <div class="order-col">
            <span class="order-section-title">Información del Cliente</span>
            <div class="form-group">
              <label for="client-name" class="form-label">Nombre Cliente</label>
              <input type="text" id="client-name" name="client_name" class="form-input" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
              <label for="client-email" class="form-label">Correo Electrónico</label>
              <input type="email" id="client-email" name="client_email" class="form-input" placeholder="cliente@email.com" required>
            </div>
          </div>

          <!-- Columna Derecha: Selección de productos -->
          <div class="order-col">
            <span class="order-section-title">Productos Disponibles</span>
            <div id="products-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
              <!-- Los productos se cargarán dinámicamente mediante JS -->
            </div>
          </div>

        </div>

        <div id="order-result-box" class="order-result-box">
          <div class="order-result-title">Total Calculado</div>
          <div id="order-total-amount" class="order-result-amount">0.00 €</div>
        </div>

        <div class="order-actions-nav">
          <a href="operations.html" class="btn btn-secondary">Volver al Menú</a>
          <button type="submit" class="btn btn-primary" id="btn-save-order">Guardar Pedido</button>
        </div>
      </form>

      <footer class="app-footer">
        <p>&copy; 2026-2027 Luxury Jewelry Network &bull; Registro Comercial</p>
      </footer>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
