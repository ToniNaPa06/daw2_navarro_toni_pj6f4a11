<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Operations Menu - Luxury Jewelry Order Management System">
  <title>Operations - Jewelry Order Management</title>
  <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>
  <main class="container">
    <div class="glass-card" id="operations-card">
      <div class="app-badge">Commercial Operations</div>

      <h1 class="app-title" id="operations-title">Operations Menu</h1>
      <p class="app-subtitle" id="operations-subtitle">
        Select a commercial action below to proceed with jewelry order management.
      </p>

      <form id="operations-form">
        <div class="operations-group" role="radiogroup" aria-label="Available Operations">
          <label class="operation-option">
            <input type="radio" name="operation" value="new-order.html" checked>
            <div class="operation-option-text">
              <span class="operation-option-title">Create a new order</span>
              <span class="operation-option-desc">Register a new jewelry purchase and calculate 21% VAT</span>
            </div>
          </label>

          <label class="operation-option">
            <input type="radio" name="operation" value="orders-menu.html">
            <div class="operation-option-text">
              <span class="operation-option-title">View orders</span>
              <span class="operation-option-desc">Consult all jewelry orders or inspect an individual order by ID</span>
            </div>
          </label>
        </div>

        <nav class="button-group-op" aria-label="Operations Navigation">
          <a href="index.html" class="btn btn-secondary" id="btn-back-home">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Home
          </a>
          <button type="submit" class="btn btn-primary" id="btn-proceed-operation">
            Continue to Operation
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </nav>
      </form>

      <footer class="app-footer">
        <p>&copy; 2026-2027 Luxury Jewelry Network &bull; Authenticated Session</p>
      </footer>
    </div>
  </main>

  <script>
    document.getElementById('operations-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const selectedOperation = document.querySelector('input[name="operation"]:checked');
      if (selectedOperation) {
        window.location.href = selectedOperation.value;
      }
    });
  </script>
</body>
</html>
