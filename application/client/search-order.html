<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search an Order by ID - Luxury Jewelry Order Management System">
  <title>Search Order - Jewelry Order Management</title>
  <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body class="home-page">
  <main class="container">
    <div class="glass-card" id="search-order-card" style="max-width: 500px; text-align: left;">
      <div class="app-badge" style="display: block; width: fit-content; margin-bottom: 1.25rem;">Order Lookup</div>

      <h1 class="app-title" id="search-order-title" style="margin-bottom: 0.5rem;">Find a Jewelry Order</h1>
      <p class="app-subtitle" id="search-order-subtitle" style="margin-bottom: 1.75rem;">
        Enter the unique order identifier to inspect the complete commercial jewelry record and tax details.
      </p>

      <form action="../server/get_order.php" method="GET" id="search-order-form">
        <div class="form-group">
          <label for="order_id" class="form-label">Order Identifier (ID)</label>
          <input 
            type="text" 
            id="order_id" 
            name="order_id" 
            class="form-input" 
            placeholder="e.g. 111" 
            required 
            autocomplete="off"
            autofocus
          >
        </div>

        <div style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
          <button type="submit" class="btn btn-primary" id="btn-submit-search" style="width: 100%;">
            Search Order
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>

        <nav class="button-group-op" aria-label="Order Search Navigation" style="gap: 0.6rem;">
          <a href="orders-menu.html" class="btn btn-secondary" id="btn-back-view-menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to View Orders
          </a>
          <a href="operations.html" class="btn btn-secondary" id="btn-back-operations">
            Back to Operations
          </a>
        </nav>

        <div style="margin-top: 0.6rem;">
          <a href="index.html" class="btn btn-secondary" style="width: 100%;" id="btn-back-home">
            Back to Home
          </a>
        </div>
      </form>

      <footer class="app-footer" style="margin-top: 2rem; text-align: center;">
        <p>&copy; 2026-2027 Luxury Jewelry Network &bull; Order Lookup</p>
      </footer>
    </div>
  </main>
</body>
</html>
