<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View Orders Menu - Luxury Jewelry Order Management System">
  <title>View Orders - Jewelry Order Management</title>
  <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>
  <main class="container">
    <div class="glass-card" id="orders-menu-card">
      <div class="app-badge">Order Consultation</div>

      <h1 class="app-title" id="orders-menu-title">View Orders</h1>
      <p class="app-subtitle" id="orders-menu-subtitle">
        Select whether to inspect the complete jewelry registry or search for a specific order.
      </p>

      <form id="orders-menu-form">
        <div class="operations-group" role="radiogroup" aria-label="Available Consultation Options">
          <label class="operation-option">
            <input type="radio" name="order_view_option" value="../server/get_all_orders.php" checked>
            <div class="operation-option-text">
              <span class="operation-option-title">View all orders</span>
              <span class="operation-option-desc">Display all registered jewelry orders in an informative table overview</span>
            </div>
          </label>

          <label class="operation-option">
            <input type="radio" name="order_view_option" value="search-order.html">
            <div class="operation-option-text">
              <span class="operation-option-title">View order by ID</span>
              <span class="operation-option-desc">Look up an individual jewelry record using its unique identifier</span>
            </div>
          </label>
        </div>

        <nav class="button-group-op" aria-label="Orders Menu Navigation">
          <a href="operations.html" class="btn btn-secondary" id="btn-back-operations">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Operations
          </a>
          <button type="submit" class="btn btn-primary" id="btn-proceed-view">
            Continue to View
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </nav>

        <div style="margin-top: 1rem;">
          <a href="index.html" class="btn btn-secondary" style="width: 100%;" id="btn-back-home">
            Back to Home
          </a>
        </div>
      </form>

      <footer class="app-footer">
        <p>&copy; 2026-2027 Luxury Jewelry Network &bull; Order Consultation</p>
      </footer>
    </div>
  </main>

  <script>
    document.getElementById('orders-menu-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const selected = document.querySelector('input[name="order_view_option"]:checked');
      if (selected) {
        window.location.href = selected.value;
      }
    });
  </script>
</body>
</html>
